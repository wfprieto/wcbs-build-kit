name: Cross Platform Verification

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"

      - name: Strict doctor verification
        run: npm run verify

      - name: Capability matrix freshness
        run: npm run check:matrix

      - name: Version consistency
        run: npm run version:audit

      - name: Governance drift gates
        run: npm run audit:governance

      - name: Behavioral fixtures
        run: npm run behavior-test

      - name: Node and Python tests
        run: npm run test

      - name: System tests
        run: npm run system-test

      - name: Install readiness
        run: npm run check-install

      - name: Upload install readiness diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: install-readiness-${{ matrix.os }}
          path: .wcbs/install-readiness.log
          if-no-files-found: warn

      - name: Release artifact generation
        run: npm run build:release-artifacts
