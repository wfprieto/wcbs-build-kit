name: Cross Platform Verification

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: "24"

      - name: Strict doctor verification
        run: npm run verify

      - name: Capability matrix freshness
        run: npm run check:matrix

      - name: Version consistency
        run: npm run version:audit

      - name: Governance drift gates
        run: npm run audit:governance

      - name: Behavioral fixtures
        run: npm run behavior-test

      - name: Node and Python tests
        run: npm run test

      - name: System tests
        run: npm run system-test

      - name: Install readiness
        run: npm run check-install

      - name: Release artifact generation
        run: npm run build:release-artifacts
