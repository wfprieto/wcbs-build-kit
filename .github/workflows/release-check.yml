name: Release Check

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release-check:
    name: Release Gate Verification
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"

      - name: Verify kit
        run: npm run verify

      - name: Tracked-file whitespace verification
        run: npm run check:whitespace

      - name: Run system tests
        run: npm run system-test

      - name: Run install and adapter smoke checks
        run: npm run check-install

      - name: Build release artifacts
        run: npm run build:release-artifacts

      - name: Verify extracted release artifact transport
        run: node --test scripts/tests/release-artifact-execution.test.mjs
        env:
          WCBS_RELEASE_ARTIFACT_DIRECTORY: dist/release-artifacts

      - name: Upload release artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: super-build-kit-release-artifacts
          path: dist/release-artifacts/
