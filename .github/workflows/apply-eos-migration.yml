name: Apply Verified EOS Migration

on:
  push:
    branches:
      - eos/remediation-v5

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: eos/remediation-v5
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '24'

      - name: Capture protected provenance hashes
        shell: bash
        run: find 90_archive/provenance -type f -print0 | sort -z | xargs -0 sha256sum > "$RUNNER_TEMP/provenance.before"

      - name: Apply corrected EOS migration
        run: node scripts/apply-eos-remediation.mjs --apply --dest "$GITHUB_WORKSPACE"

      - name: Prove migration idempotency
        shell: bash
        run: |
          git diff --binary > "$RUNNER_TEMP/first.patch"
          node scripts/apply-eos-remediation.mjs --apply --dest "$GITHUB_WORKSPACE"
          git diff --binary > "$RUNNER_TEMP/second.patch"
          cmp "$RUNNER_TEMP/first.patch" "$RUNNER_TEMP/second.patch"

      - name: Prove provenance unchanged
        shell: bash
        run: |
          find 90_archive/provenance -type f -print0 | sort -z | xargs -0 sha256sum > "$RUNNER_TEMP/provenance.after"
          cmp "$RUNNER_TEMP/provenance.before" "$RUNNER_TEMP/provenance.after"

      - name: Run complete verification chain
        run: |
          npm run check
          npm run verify
          npm run system-test
          npm run check-install
          npm run build:release-artifacts

      - name: Commit verified migration
        shell: bash
        run: |
          if git diff --quiet && git diff --cached --quiet; then
            echo 'No migration changes to commit.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Apply verified EOS v5 repository migration'
          git push origin HEAD:eos/remediation-v5
